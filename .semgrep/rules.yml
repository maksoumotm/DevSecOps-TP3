rules:
  - id: sql-injection-taint-express
    languages: [javascript, typescript]
    severity: ERROR
    message: >
      Injection SQL détectée : valeur issue de req.body/req.params/req.query
      utilisée directement dans une requête SQL sans paramètre préparé.
    metadata:
      category: security
      cwe: CWE-89
      owasp: "A1:2017 - Injection"
    mode: taint
    pattern-sources:
      - pattern: req.body
      - pattern: req.params
      - pattern: req.query
    pattern-sinks:
      - pattern-either:
          - pattern: $X.execute($SQL, ...)
          - pattern: $X.query($SQL, ...)
          - pattern: $X.get($SQL, ...)
          - pattern: $X.run($SQL, ...)
          - pattern: $X.all($SQL, ...)
